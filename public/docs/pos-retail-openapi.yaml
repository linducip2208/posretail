openapi: 3.0.3
info:
  title: POS Retail API
  description: REST API v1 + endpoint POS internal untuk aplikasi kasir (Flutter/Android) dan integrasi.
  version: 1.0.0
servers:
  - url: https://posretail.whitelabel.co.id/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Local
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token (dari POST /login)
  schemas:
    OrderItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: integer, example: 1 }
        product_variant_id: { type: integer, nullable: true }
        quantity: { type: integer, minimum: 1, maximum: 1000, example: 2 }
        discount_percent: { type: number, example: 0 }
    Payment:
      type: object
      required: [payment_method_id, amount]
      properties:
        payment_method_id: { type: integer, example: 1 }
        amount: { type: number, minimum: 0, example: 30000 }
    Order:
      type: object
      required: [outlet_id, items, payments]
      properties:
        outlet_id: { type: integer, example: 1 }
        customer_id: { type: integer, nullable: true }
        order_type: { type: string, example: walk_in }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/OrderItem' }
        payments:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/Payment' }
paths:
  /login:
    post:
      summary: Login kasir → token Sanctum
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: kasir@pos-retail.test }
                password: { type: string, example: password }
                device_name: { type: string, example: android-kasir-01 }
      responses:
        '200':
          description: Token + data user + outlet yang bisa diakses
  /logout:
    post:
      summary: Revoke token aktif
      responses: { '200': { description: OK } }
  /user:
    get:
      summary: Profil user login
      responses: { '200': { description: OK } }
  /outlets:
    get:
      summary: Daftar outlet yang bisa diakses user
      responses: { '200': { description: OK } }
  /products:
    get:
      summary: Daftar produk (paginasi, filter search/category)
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /products/{product}:
    get:
      summary: Detail produk
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK }, '404': { description: Tidak ditemukan } }
  /products/barcode:
    post:
      summary: Cari produk/varian via barcode atau SKU
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [barcode]
              properties:
                barcode: { type: string, example: '8991000000001' }
      responses: { '200': { description: OK }, '404': { description: Tidak ditemukan } }
  /categories:
    get:
      summary: Daftar kategori
      responses: { '200': { description: OK } }
  /customers:
    get:
      summary: Daftar pelanggan
      responses: { '200': { description: OK } }
    post:
      summary: Tambah pelanggan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: Budi Santoso }
                phone: { type: string, example: '0812000001' }
                email: { type: string, format: email }
      responses: { '201': { description: Dibuat } }
  /customers/{customer}:
    get:
      summary: Detail pelanggan + riwayat
      parameters:
        - { name: customer, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /customers/{customer}/deposits:
    post:
      summary: Deposit / top-up saldo pelanggan
      parameters:
        - { name: customer, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 1 }
      responses: { '200': { description: OK } }
  /orders:
    post:
      summary: Buat order (checkout, harga dari server)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      responses: { '200': { description: Order dibuat }, '422': { description: Validasi/stok gagal } }
  /orders/history:
    get:
      summary: Riwayat order user/outlet
      responses: { '200': { description: OK } }
  /orders/today:
    get:
      summary: Order hari ini (kasir/display)
      responses: { '200': { description: OK } }
  /orders/sync-batch:
    post:
      summary: Sync batch order offline (maks 50, idempoten via client_uuid)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orders]
              properties:
                orders:
                  type: array
                  maxItems: 50
                  items:
                    allOf:
                      - $ref: '#/components/schemas/Order'
                      - type: object
                        required: [client_uuid]
                        properties:
                          client_uuid: { type: string, format: uuid }
      responses: { '200': { description: OK } }
  /orders/{order}:
    get:
      summary: Detail order
      parameters:
        - { name: order, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /orders/{order}/refund:
    post:
      summary: Refund order (stok kembali, pembayaran refunded)
      parameters:
        - { name: order, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /orders/{order}/split:
    post:
      summary: Split item ke order baru
      parameters:
        - { name: order, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [moves]
              properties:
                moves:
                  type: array
                  items:
                    type: object
                    required: [order_item_id]
                    properties:
                      order_item_id: { type: integer }
                      quantity: { type: integer }
      responses: { '200': { description: OK } }
  /payment-methods:
    get:
      summary: Metode pembayaran aktif
      responses: { '200': { description: OK } }
  /payment/presets:
    get:
      summary: Preset nominal pembayaran
      responses: { '200': { description: OK } }
  /payment/create:
    post:
      summary: Buat transaksi payment gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, amount]
              properties:
                order_id: { type: integer }
                amount: { type: number }
      responses: { '200': { description: OK } }
  /payment/status:
    post:
      summary: Cek status transaksi gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference]
              properties:
                reference: { type: string }
      responses: { '200': { description: OK } }
  /shifts/open:
    post:
      summary: Buka shift kasir + saldo awal drawer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outlet_id]
              properties:
                outlet_id: { type: integer }
                opening_balance: { type: number, example: 100000 }
      responses: { '200': { description: OK } }
  /shifts/{shift}/close:
    post:
      summary: Tutup shift + rekonsiliasi kas
      parameters:
        - { name: shift, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /inventory/forecast:
    get:
      summary: Ramalan permintaan produk
      responses: { '200': { description: OK } }
  /webhooks/{providerCode}:
    post:
      summary: Webhook payment gateway (tanpa auth, rate-limit 30/min)
      security: []
      parameters:
        - { name: providerCode, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: OK } }
  /webhooks/marketplace/{platform}:
    post:
      summary: Webhook marketplace (tanpa auth)
      security: []
      parameters:
        - { name: platform, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: OK } }
  /purchase-orders:
    get:
      summary: List PO (filter status, supplier_id, outlet_id)
      responses: { '200': { description: OK } }
    post:
      summary: Buat PO draft + items (total dihitung server)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplier_id, outlet_id, items]
              properties:
                supplier_id: { type: integer }
                outlet_id: { type: integer }
                notes: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [product_id, quantity, unit_price]
                    properties:
                      product_id: { type: integer }
                      quantity: { type: integer }
                      unit_price: { type: number }
      responses: { '201': { description: Dibuat } }
  /purchase-orders/{id}/receive:
    post:
      summary: Terima PO (status → received + jurnal otomatis)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /suppliers:
    get:
      summary: List supplier (search nama/telepon)
      responses: { '200': { description: OK } }
    post:
      summary: Tambah supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                contact_person: { type: string }
                phone: { type: string }
      responses: { '201': { description: Dibuat } }
  /stock-opnames:
    post:
      summary: Buat opname + item aktual (selisih dihitung server)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outlet_id, items]
              properties:
                outlet_id: { type: integer }
                items:
                  type: array
                  items:
                    type: object
                    required: [product_id, actual_stock]
                    properties:
                      product_id: { type: integer }
                      actual_stock: { type: integer }
      responses: { '201': { description: Dibuat } }
  /stock-opnames/{id}/approve:
    post:
      summary: Setujui opname (koreksi stok + movement, idempoten)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /stock-transfers:
    post:
      summary: Buat transfer antar outlet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_outlet_id, to_outlet_id, items]
              properties:
                from_outlet_id: { type: integer }
                to_outlet_id: { type: integer }
                items:
                  type: array
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: integer }
                      quantity: { type: integer }
      responses: { '201': { description: Dibuat } }
  /stock-transfers/{id}/receive:
    post:
      summary: Terima transfer (movement keluar+masuk audit)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /stock-movements:
    get:
      summary: Jejak mutasi stok read-only (filter product_id, type, outlet_id)
      responses: { '200': { description: OK } }
  /raw-materials:
    get:
      summary: Bahan baku (filter search, low_stock)
      responses: { '200': { description: OK } }
  /returns:
    post:
      summary: Ajukan retur (validasi kumulatif vs qty dibeli)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, reason, items]
              properties:
                order_id: { type: integer }
                reason: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: integer }
                      quantity: { type: integer }
      responses: { '201': { description: Dibuat } }
  /returns/{id}/approve:
    post:
      summary: Setujui retur (stok kembali + refund, idempoten)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /held-carts:
    get:
      summary: Keranjang tertahan milik user login
      responses: { '200': { description: OK } }
    post:
      summary: Tahan keranjang (auto-expire 24 jam)
      responses: { '201': { description: Dibuat } }
  /discounts:
    get:
      summary: Template diskon aktif (read-only)
      responses: { '200': { description: OK } }
  /installments:
    get:
      summary: Daftar cicilan
      responses: { '200': { description: OK } }
  /installments/{id}/pay:
    post:
      summary: Bayar cicilan (sisa & status order diperbarui)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, payment_method_id]
              properties:
                amount: { type: number }
                payment_method_id: { type: integer }
      responses: { '200': { description: OK } }
  /loyalty/summary:
    get:
      summary: Poin & tier pelanggan (query customer_id)
      parameters:
        - { name: customer_id, in: query, required: true, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /loyalty/rewards:
    get:
      summary: Katalog reward aktif
      responses: { '200': { description: OK } }
  /loyalty/redeem:
    post:
      summary: Tukar reward (cek saldo poin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, reward_id]
              properties:
                customer_id: { type: integer }
                reward_id: { type: integer }
      responses: { '200': { description: OK }, '422': { description: Poin tidak cukup } }
  /users:
    get:
      summary: User se-outlet (tanpa hash, owner/manager)
      responses: { '200': { description: OK } }
  /roles:
    get:
      summary: Daftar role (owner/manager)
      responses: { '200': { description: OK } }
  /attendances/clock-in:
    post:
      summary: Clock-in (anti-ganda per hari)
      responses: { '201': { description: OK } }
  /attendances/clock-out:
    post:
      summary: Clock-out
      responses: { '200': { description: OK } }
  /reports/sales:
    get:
      summary: Omzet, transaksi, rata-rata, top produk (maks 93 hari)
      responses: { '200': { description: OK }, '422': { description: Rentang terlalu panjang } }
  /reports/stock:
    get:
      summary: Nilai inventori, low-stock, out-of-stock
      responses: { '200': { description: OK } }
  /reports/finance:
    get:
      summary: Pemasukan vs pengeluaran (maks 93 hari)
      responses: { '200': { description: OK } }
  /brands:
    get:
      summary: Daftar merek
      responses: { '200': { description: OK } }
  /units:
    get:
      summary: Daftar satuan
      responses: { '200': { description: OK } }
  /expenses:
    get:
      summary: Daftar pengeluaran (owner/manager/admin/gudang sesuai akses finance)
      responses: { '200': { description: OK } }
    post:
      summary: Catat pengeluaran
      responses: { '201': { description: Dibuat } }
  /shifts:
    get:
      summary: Riwayat shift user login
      responses: { '200': { description: OK } }
