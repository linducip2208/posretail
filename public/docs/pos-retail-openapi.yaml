openapi: 3.0.3
info:
  title: POS Retail API
  description: REST API v1 + endpoint POS internal untuk aplikasi kasir (Flutter/Android) dan integrasi.
  version: 1.0.0
servers:
  - url: https://posretail.whitelabel.co.id/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Local
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token (dari POST /login)
  schemas:
    OrderItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: integer, example: 1 }
        product_variant_id: { type: integer, nullable: true }
        quantity: { type: integer, minimum: 1, maximum: 1000, example: 2 }
        discount_percent: { type: number, example: 0 }
    Payment:
      type: object
      required: [payment_method_id, amount]
      properties:
        payment_method_id: { type: integer, example: 1 }
        amount: { type: number, minimum: 0, example: 30000 }
    Order:
      type: object
      required: [outlet_id, items, payments]
      properties:
        outlet_id: { type: integer, example: 1 }
        customer_id: { type: integer, nullable: true }
        order_type: { type: string, example: walk_in }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/OrderItem' }
        payments:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/Payment' }
paths:
  /login:
    post:
      summary: Login kasir → token Sanctum
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: kasir@pos-retail.test }
                password: { type: string, example: password }
                device_name: { type: string, example: android-kasir-01 }
      responses:
        '200':
          description: Token + data user + outlet yang bisa diakses
  /logout:
    post:
      summary: Revoke token aktif
      responses: { '200': { description: OK } }
  /user:
    get:
      summary: Profil user login
      responses: { '200': { description: OK } }
  /outlets:
    get:
      summary: Daftar outlet yang bisa diakses user
      responses: { '200': { description: OK } }
  /products:
    get:
      summary: Daftar produk (paginasi, filter search/category)
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /products/{product}:
    get:
      summary: Detail produk
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK }, '404': { description: Tidak ditemukan } }
  /products/barcode:
    post:
      summary: Cari produk/varian via barcode atau SKU
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [barcode]
              properties:
                barcode: { type: string, example: '8991000000001' }
      responses: { '200': { description: OK }, '404': { description: Tidak ditemukan } }
  /categories:
    get:
      summary: Daftar kategori
      responses: { '200': { description: OK } }
  /customers:
    get:
      summary: Daftar pelanggan
      responses: { '200': { description: OK } }
    post:
      summary: Tambah pelanggan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: Budi Santoso }
                phone: { type: string, example: '0812000001' }
                email: { type: string, format: email }
      responses: { '201': { description: Dibuat } }
  /customers/{customer}:
    get:
      summary: Detail pelanggan + riwayat
      parameters:
        - { name: customer, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /customers/{customer}/deposits:
    post:
      summary: Deposit / top-up saldo pelanggan
      parameters:
        - { name: customer, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 1 }
      responses: { '200': { description: OK } }
  /orders:
    post:
      summary: Buat order (checkout, harga dari server)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      responses: { '200': { description: Order dibuat }, '422': { description: Validasi/stok gagal } }
  /orders/history:
    get:
      summary: Riwayat order user/outlet
      responses: { '200': { description: OK } }
  /orders/today:
    get:
      summary: Order hari ini (kasir/display)
      responses: { '200': { description: OK } }
  /orders/sync-batch:
    post:
      summary: Sync batch order offline (maks 50, idempoten via client_uuid)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orders]
              properties:
                orders:
                  type: array
                  maxItems: 50
                  items:
                    allOf:
                      - $ref: '#/components/schemas/Order'
                      - type: object
                        required: [client_uuid]
                        properties:
                          client_uuid: { type: string, format: uuid }
      responses: { '200': { description: OK } }
  /orders/{order}:
    get:
      summary: Detail order
      parameters:
        - { name: order, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /orders/{order}/refund:
    post:
      summary: Refund order (stok kembali, pembayaran refunded)
      parameters:
        - { name: order, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /orders/{order}/split:
    post:
      summary: Split item ke order baru
      parameters:
        - { name: order, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [moves]
              properties:
                moves:
                  type: array
                  items:
                    type: object
                    required: [order_item_id]
                    properties:
                      order_item_id: { type: integer }
                      quantity: { type: integer }
      responses: { '200': { description: OK } }
  /payment-methods:
    get:
      summary: Metode pembayaran aktif
      responses: { '200': { description: OK } }
  /payment/presets:
    get:
      summary: Preset nominal pembayaran
      responses: { '200': { description: OK } }
  /payment/create:
    post:
      summary: Buat transaksi payment gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, amount]
              properties:
                order_id: { type: integer }
                amount: { type: number }
      responses: { '200': { description: OK } }
  /payment/status:
    post:
      summary: Cek status transaksi gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference]
              properties:
                reference: { type: string }
      responses: { '200': { description: OK } }
  /shifts/open:
    post:
      summary: Buka shift kasir + saldo awal drawer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outlet_id]
              properties:
                outlet_id: { type: integer }
                opening_balance: { type: number, example: 100000 }
      responses: { '200': { description: OK } }
  /shifts/{shift}/close:
    post:
      summary: Tutup shift + rekonsiliasi kas
      parameters:
        - { name: shift, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /inventory/forecast:
    get:
      summary: Ramalan permintaan produk
      responses: { '200': { description: OK } }
  /webhooks/{providerCode}:
    post:
      summary: Webhook payment gateway (tanpa auth, rate-limit 30/min)
      security: []
      parameters:
        - { name: providerCode, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: OK } }
  /webhooks/marketplace/{platform}:
    post:
      summary: Webhook marketplace (tanpa auth)
      security: []
      parameters:
        - { name: platform, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: OK } }
